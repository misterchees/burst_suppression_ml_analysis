frequency_bands:
  Delta:
  - 0.5
  - 4
  Theta:
  - 4
  - 8
  Alpha:
  - 8
  - 13
  Beta:
  - 13
  - 30
initial_params:
  merged_episodes: false
  bis_threshold: 70
  mac_threshold: 0.8
  min_episode_length: 20
  refractory_time: 5
  fixed_window_size: 20
  overlap: 0.0
current_params:
  merged_episodes: false
  bis_threshold: 70
  mac_threshold: 0.8
  min_episode_length: 20
  refractory_time: 5
  fixed_window_size: 20
  overlap: 0.9
filtering_params:
  butterworth:
    lowcut: 0.5
    highcut: 30.0
    order: 4
transform_params:
  welch:
    channel: 1
    nperseg_seconds: 2
    fs: 128
feature_params:
  relative_bandpower:
    normalize_to: "bands"
  shannon_entropy:
    normalize: true
  spectral_skewness:
    normalize: true
    n_method: "clip"
    lower_bound: 0
    upper_bound: 1
  spectral_kurtosis:
    normalize: true
    n_method: "clip"
    lower_bound: 0
    upper_bound: 1
  mean:
    channel: 1
  variance:
    channel: 1
  amplitude:
    channel: 1
  sample_entropy:
    channel: 1
    emb_dim: 2
    tolerance: 0.2
  permutation_entropy:
    channel: 1
    order: 3
    delay: 1
    normalize: true
  fuzzy_entropy:
    channel: 1
    m: 2
    r: 0.2
    n: 2
classification_params:
  test_size: 0.15,
  random_seed: 42,
  remove_outliers: false,
  svm:
    C: 1,
    kernel: "rbf"